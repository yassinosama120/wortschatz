<script>
// [deck, article, word, plural, icon, German explanation, English, English notes]
const D=[
["Nouns","das","Buch","Bücher","📖","Ein Gegenstand mit vielen Seiten, den man liest.","book","Neuter; plural takes an umlaut and -er."],
["Nouns","die","Katze","Katzen","🐱","Ein kleines Haustier mit Fell, das miaut.","cat","Feminine; many nouns ending in -e are feminine."],
["Nouns","der","Hund","Hunde","🐶","Ein Haustier, das bellt und gern spazieren geht.","dog","Masculine; plural adds -e."],
["Nouns","das","Haus","Häuser","🏠","Ein Gebäude, in dem Menschen wohnen.","house","Neuter; umlaut + -er in the plural."],
["Nouns","das","Auto","Autos","🚗","Ein Fahrzeug mit vier Rädern und einem Motor.","car","Neuter; loanwords often take -s."],
["Nouns","der","Apfel","Äpfel","🍎","Eine runde Frucht, die rot oder grün sein kann.","apple","Masculine; umlaut in the plural."],
["Nouns","das","Wasser","Wasser","💧","Eine klare Flüssigkeit, die man trinkt.","water","Neuter; the plural is rarely used."],
["Nouns","die","Sonne","Sonnen","☀️","Der helle Stern, der uns am Tag Licht und Wärme gibt.","sun","Feminine."],
["Nouns","der","Baum","Bäume","🌳","Eine große Pflanze mit Stamm, Ästen und Blättern.","tree","Masculine; umlaut in the plural."],
["Nouns","die","Schule","Schulen","🏫","Ein Ort, an dem Kinder und Jugendliche lernen.","school","Feminine."],
["Nouns","der","Zug","Züge","🚆","Ein Fahrzeug auf Schienen, das viele Menschen transportiert.","train","Masculine; umlaut in the plural."],
["Nouns","das","Brot","Brote","🍞","Ein Lebensmittel, das aus Mehl gebacken wird.","bread","Neuter."],
["Verbs","","lernen","","📚","Neues Wissen oder neue Fähigkeiten bekommen.","to learn","Regular: ich lerne, er lernt, hat gelernt."],
["Verbs","","gehen","","🚶","Sich zu Fuß von einem Ort zum anderen bewegen.","to go, to walk","Irregular: ich gehe, er geht, ist gegangen."],
["Verbs","","essen","","🍽️","Nahrung zu sich nehmen.","to eat","Irregular: er isst, hat gegessen."],
["Verbs","","schlafen","","😴","Nachts mit geschlossenen Augen im Bett ruhen.","to sleep","Irregular: er schläft, hat geschlafen."],
["Verbs","","sprechen","","🗣️","Mit Worten etwas sagen.","to speak","Irregular: er spricht, hat gesprochen."],
["Verbs","","fahren","","🚌","Sich mit einem Fahrzeug fortbewegen.","to drive, to travel","Irregular: er fährt, ist gefahren."],
["Phrases","","Guten Morgen","","🌅","Ein Gruß, den man am Morgen sagt.","Good morning","Used until about 10 a.m."],
["Phrases","","Wie geht’s?","","🙂","Eine Frage, mit der man nach dem Befinden fragt.","How are you?","Informal short form of “Wie geht es dir?”"],
["Phrases","","Ich verstehe nicht","","🤷","Das sagt man, wenn man etwas nicht begreift.","I don’t understand","Useful survival phrase."],
["Phrases","","Wo ist der Bahnhof?","","🚉","Eine Frage nach dem Weg zum Zug.","Where is the train station?","der Bahnhof is masculine."],
["Phrases","","Entschuldigung","","🙏","Man sagt das, um höflich um Aufmerksamkeit zu bitten.","Excuse me, sorry","Works for both."],
["Phrases","","Ich hätte gern einen Kaffee","","☕","Eine höfliche Art, etwas zu bestellen.","I’d like a coffee, please","“hätte” is Konjunktiv II of haben (polite)."]
];
const CN={Nouns:"A1 · Nouns",Verbs:"A1 · Verbs",Phrases:"Daily Phrases"};
// English translations of the German explanations (paired in the hidden translation panel)
const DEN={"Buch":"An object with many pages that you read.","Katze":"A small pet with fur that meows.","Hund":"A pet that barks and likes going for walks.","Haus":"A building where people live.","Auto":"A vehicle with four wheels and an engine.","Apfel":"A round fruit that can be red or green.","Wasser":"A clear liquid that you drink.","Sonne":"The bright star that gives us light and warmth during the day.","Baum":"A large plant with a trunk, branches and leaves.","Schule":"A place where children and teenagers learn.","Zug":"A vehicle on rails that transports many people.","Brot":"A food that is baked from flour.","lernen":"To gain new knowledge or new skills.","gehen":"To move from one place to another on foot.","essen":"To take in food.","schlafen":"To rest in bed at night with your eyes closed.","sprechen":"To say something with words.","fahren":"To move around using a vehicle.","Guten Morgen":"A greeting you say in the morning.","Wie geht’s?":"A question used to ask how someone is doing.","Ich verstehe nicht":"You say this when you can’t grasp something.","Wo ist der Bahnhof?":"A question asking for the way to the train station.","Entschuldigung":"You say this to politely ask for someone’s attention.","Ich hätte gern einen Kaffee":"A polite way of ordering something."};
const dxOf=c=>c.dx||DEN[c.de]||"";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>dk(new Date());
const full=c=>(c.art?c.art+" ":"")+c.de;
const norm=s=>String(s).toLowerCase().replace(/^(der|die|das)\s+/,"").replace(/[^\p{L}\s]/gu,"").replace(/\s+/g," ").trim();
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const def=()=>({cards:[],set:{theme:"auto",pal:"minimal",fs:16},log:{},id:1});
const K="wortschatz.v1";
let S=(()=>{try{const r=JSON.parse(localStorage.getItem(K));if(r&&r.cards)return r}catch(e){}return def()})();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let T="study",E=null,P=null,F={q:"",d:"All"},Q={on:false,mode:"mixed",queue:[],i:0,done:0};
let tt;
function toast(m){const t=$("#toast"),w=/…$/.test(m);t.textContent=(w?"⏳ ":"")+m;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,w?90000:5000);if(!w&&/✓|finished|added|moved|saved|created|removed|restored|downloaded/i.test(m)){try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}}}
function theme(){const r=document.documentElement;r.dataset.pal=S.set.pal;if(S.set.theme==="auto")r.removeAttribute("data-theme");else r.dataset.theme=S.set.theme;r.style.fontSize=S.set.fs+"px"}

// ---------- SM-2 (q: 1 Again, 3 Hard, 4 Good, 5 Easy) ----------
function sm2(c,q){if(q<7){c.ve=0;c.ms=0}else if(q===7){if(c.ms>0){c.ms=0;c.ve=1}else c.ve=(c.ve||0)+1}else if(q===8)c.ms=(c.ms||0)+1;
 if(q<3){c.reps=0;c.iv=0;c.due=Date.now()+IV[q];c.lap=(c.lap||0)+1}
 else{c.reps++;c.iv=IV[q]/864e5;c.due=Date.now()+IV[q]}
 c.ef=Math.max(1.3,c.ef+.1-(5-q)*(.08+(5-q)*.02));c.n++;return c}
const ivText=(c,q)=>{const t=IV[q];return t<36e5?Math.round(t/6e4)+"m":t<864e5?Math.round(t/36e5)+"h":t/864e5+"d"};

// ---------- cards, enrichment, speech ----------
const mk=o=>({id:S.id++,deck:o.deck||"My Words",art:o.art||"",de:o.de,pl:o.pl||"",icon:o.icon||"🔤",def:o.def||"",en:o.en||"",note:o.note||"",dx:o.dx||"",ex:o.ex||"",exe:o.exe||"",kind:o.kind||"",tags:o.tags||[],ef:2.5,reps:0,iv:0,due:Date.now(),n:0});
function enrich(raw){
 const t=raw.trim().replace(/\s+/g," "),m=t.match(/^(der|die|das)\s+(.+)$/i),w=(m?m[2]:t).toLowerCase();
 const e=D.find(x=>x[2].toLowerCase()===w||x[2].toLowerCase()===t.toLowerCase());
 if(e)return{src:raw,found:1,deck:"My Words",art:e[1],de:e[2],pl:e[3],icon:e[4],def:e[5],en:e[6],note:e[7]};
 const art=m?m[1].toLowerCase():"";
 return{src:raw,found:0,deck:"My Words",art,de:m?m[2]:t,pl:"",icon:"🔤",def:"Erklärung noch offen – bitte ergänzen.",en:"",note:art?"Gender taken from the article you typed; plural unknown.":"Not in the offline lexicon – add a translation."}}
function speak(txt,rate){try{const u=new SpeechSynthesisUtterance(txt);u.lang="de-DE";u.rate=rate||S.set.sp||.9;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith("de"));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){toast("Speech output isn’t available here")}}
function mic(cb){
 const R=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!R){const s=D[Math.floor(Math.random()*D.length)];toast("No speech recognition here – simulated input");cb(full({art:s[1],de:s[2]}));return}
 try{const r=new R();r.lang="de-DE";r.onresult=e=>cb(e.results[0][0].transcript);r.onerror=()=>toast("Couldn’t hear anything");r.start();toast("Listening…")}catch(e){toast("Microphone unavailable")}}
const have=k=>D.filter(e=>e[0]===k).every(e=>S.cards.some(c=>c.deck===CN[k]&&c.de===e[2]));
const inst=k=>(S.inst=S.inst||{},S.inst[k]=1,D.filter(e=>e[0]===k)).forEach(e=>{if(!S.cards.some(c=>c.deck===CN[k]&&c.de===e[2]))S.cards.push(mk({deck:CN[k],art:e[1],de:e[2],pl:e[3],icon:e[4],def:e[5],en:e[6],note:e[7],tags:[k.toLowerCase()]}))});
function streak(){let n=0,d=new Date();if(!(S.log[today()]||{}).r)d.setDate(d.getDate()-1);while((S.log[dk(d)]||{}).r){n++;d.setDate(d.getDate()-1)}return n}

// ---------- forms ----------
const form=o=>`<label class="mut">Article</label><select id="fa">${["","der","die","das"].map(a=>`<option ${o.art===a?"selected":""} value="${a}">${a||"— none —"}</option>`).join("")}</select>`+
[["fd","Word or phrase",o.de],["fp","Plural",o.pl],["fk","Deck (change it to move the card)",o.deck],["ft","Tags (comma-separated)",(o.tags||[]).join(", ")],["fi","Icon (emoji)",o.icon]].map(f=>`<label class="mut">${f[1]}</label><input id="${f[0]}"${f[0]==="fk"?' list="dl2"':""} value="${esc(f[2])}">`).join("")+
`<label class="mut">German explanation</label><textarea id="ff" rows="2">${esc(o.def)}</textarea><label class="mut">English translation (hidden while studying)</label><input id="fe" value="${esc(o.en)}"><label class="mut">English translation of the explanation</label><textarea id="fx" rows="2">${esc(o.dx||DEN[o.de]||"")}</textarea><label class="mut">English notes</label><input id="fn" value="${esc(o.note)}"><datalist id="dl2">${[...new Set(S.cards.map(c=>c.deck))].sort().map(d=>`<option value="${esc(d)}">`).join("")}</datalist>`;
const readForm=()=>{const v=i=>$("#"+i).value.trim();return{art:v("fa"),de:v("fd"),pl:v("fp"),deck:v("fk")||"My Words",tags:v("ft").split(",").map(s=>s.trim()).filter(Boolean),icon:v("fi")||"🔤",def:v("ff"),en:v("fe"),note:v("fn"),dx:v("fx")}};

// ---------- online generation ----------
const LV=["A1","A2","B1","B2","C1","C2"],TP=["Daily Conversation","Food & Drink","Shopping","Travel & Transport","Housing","Health & Doctor","Work & Jobs","Business","Education & University","Engineering","Motorsports","Bureaucracy & Forms","Banking & Money","Family & Friends","Weather & Nature","Hobbies & Sports","Technology","Society & Politics","Culture & Media","Emergencies"],TY=["vocabulary","phrases","verbs","adjectives","idioms"];
let O={n:10,lv:["C1"],tp:["Engineering"],ty:["vocabulary"],ot:"",busy:0};
const chips=(a,k)=>a.map(x=>`<button class="${O[k].includes(x)?"p":"s"}" data-a="ochip" data-k="${k}" data-v="${x}">${x}</button>`).join("");
function onlineCard(){const on=navigator.onLine;return `<h2>Add cards online</h2><div class="card"><div class="mut">${on?"🟢 Online – generated cards are saved to this device automatically.":"🔴 Offline – connect to the internet to generate cards. Saved cards still work."}</div><label class="mut">Number of cards (1–50)</label><input id="on" type="number" min="1" max="50" value="${O.n}"><label class="mut">Levels</label><div class="row wrap">${chips(LV,"lv")}</div><label class="mut">Topics</label><div class="row wrap">${chips(TP,"tp")}</div><input id="ot" placeholder="Other topic (optional)" value="${esc(O.ot)}" style="margin-top:6px"><label class="mut">Card types</label><div class="row wrap">${chips(TY,"ty")}</div>${srcSel()}<button class="p w" style="margin-top:10px" data-a="gen" ${on&&!O.busy?"":"disabled"}>${O.busy?"Generating…":"Generate & save"}</button></div>`}
// ---------- AI providers, fallback, dictionary ----------
const PVN={claude:"Claude (built-in)",anthropic:"Claude API key",gemini:"Gemini",openai:"ChatGPT"},DM={anthropic:"claude-haiku-5-5",gemini:"gemini-flash-latest",openai:"gpt-4o-mini"};
const keyOf=p=>(S.set.keys||{})[p]||"";
const okp=p=>p==="claude"?typeof claude!=="undefined":!!keyOf(p);
async function call(p,pr,retry){
 if(p==="claude"){const sm=await claude.use("sample");return (await sm(pr,{cache:false})).text}

const gram=()=>`<h2>Grammar</h2><div class="card"><b>Articles by case</b><table class="gt"><tr><th></th><th>der</th><th>die</th><th>das</th><th>pl.</th></tr><tr><td>Nom.</td><td>der</td><td>die</td><td>das</td><td>die</td></tr><tr><td>Akk.</td><td>den</td><td>die</td><td>das</td><td>die</td></tr><tr><td>Dat.</td><td>dem</td><td>der</td><td>dem</td><td>den (+n)</td></tr><tr><td>Gen.</td><td>des</td><td>der</td><td>des</td><td>der</td></tr></table><p class="mut">Columns show the noun’s gender. Masculine and neuter nouns usually add -(e)s in the genitive.</p></div><div class="card"><b>Verb position</b><p>Main clause: verb in 2nd place. Questions: verb first. Subordinate clause (weil, dass, wenn): verb at the end. Perfekt: haben/sein in 2nd place, participle at the end.</p></div><div class="card"><b>Prepositions</b><p><b>Akkusativ:</b> durch, für, gegen, ohne, um<br><b>Dativ:</b> aus, bei, mit, nach, seit, von, zu<br><b>Two-way</b> (Akk. = where to, Dat. = where): an, auf, hinter, in, neben, über, unter, vor, zwischen<br><b>Genitiv:</b> während, wegen, trotz, statt</p></div><div class="card"><b>Present-tense endings (regular verbs)</b><p>ich -e · du -st · er/sie/es -t · wir -en · ihr -t · sie/Sie -en</p></div><div class="card"><b>Modal verbs</b><p>können, müssen, wollen, sollen, dürfen, mögen: the modal takes 2nd place and the infinitive goes to the end. <i>Ich muss heute lernen.</i></p></div><div class="card"><b>Separable verbs</b><p>aufstehen → <i>Ich stehe um 7 Uhr auf.</i> Perfekt: <i>ist aufgestanden</i>. In subordinate clauses they stay together: <i>…, dass er aufsteht.</i></p></div><div class="card"><b>Word order: TeKaMoLo</b><p>Time → Reason (kausal) → Manner (modal) → Place (lokal): <i>Ich fahre morgen wegen der Arbeit mit dem Zug nach Berlin.</i></p></div><div class="card"><b>Adjective endings</b><p>After der/die/das: Nom. -e (all singular); Akk. masc. -en, fem./neut. -e; Dat., Gen. and all plurals -en. After ein-words the masculine nominative is -er and the neuter nominative/accusative is -es.</p></div><div class="card"><b>Connectors</b><p><b>No word-order change:</b> und, aber, oder, denn, sondern.<br><b>Verb right after:</b> deshalb, darum, trotzdem, dann.<br><b>Verb at the end:</b> weil, dass, obwohl, wenn, als, damit, während, nachdem, ob.</p></div><div class="card"><b>Perfekt vs. Präteritum</b><p>Speech and everyday writing: Perfekt (<i>ich habe gemacht</i>). Formal writing and narration: Präteritum (<i>ich machte</i>). sein, haben and modals prefer the Präteritum even in speech (<i>war, hatte, konnte</i>).</p></div><div class="card"><b>Konjunktiv II</b><p>Polite requests and unreal situations: <i>hätte, wäre, könnte, würde + Infinitiv</i>. <i>Wenn ich Zeit hätte, würde ich mehr lesen.</i></p></div><div class="card"><b>Passive</b><p>werden + Partizip II: <i>Das Haus wird gebaut.</i> Past: <i>wurde gebaut</i>. Result state: sein + Partizip II: <i>Das Haus ist gebaut.</i> The agent uses von + Dativ.</p></div><div class="card"><b>Relative clauses</b><p>The pronoun matches the noun’s gender and number; its case comes from its role in the clause. Forms equal the articles except dative plural <i>denen</i> and genitive <i>dessen/deren</i>. The verb goes to the end, set off by commas.</p></div><div class="card"><b>Academic style</b><p>Nominalisation (<i>analysieren → die Analyse</i>), passive and impersonal forms (<i>man</i>, <i>es wird gezeigt, dass …</i>), and fixed verb phrases (<i>in Betracht ziehen, zur Verfügung stellen</i>).</p></div>`;

   const part=todo.slice(i,i+bs);toast("Looking up words "+(i+1)+"–"+(i+part.length)+" of "+todo.length+"…");
   let res=null,err="";
   for(let a=0;a<2&&!res;a++){try{res=await lookAll(part,lookPr(part))}catch(e){err=(e&&e.msg)||"the AI didn’t answer"}}
   if(!res){R.fail.push(...part.map(w=>w+" ("+err+")"));continue}
   res.forEach((r,j)=>{const w=part[j]||"";
    if(!r||!r.de||r.found===false){R.nf.push(w||"?");return}
    const art=["der","die","das"].includes(r.art)?r.art:"",key=nf((art?art+" ":"")+r.de),ex=S.cards.find(c=>nf(full(c))===key);
    if(ex){R.dups.push("“"+w+"” – already in your library as “"+full(ex)+"” ("+ex.deck+")");return}
    const d2=dn||autoDeck(r);
    S.cards.push(mk({kind:r.kind,deck:d2,art,de:r.de,pl:r.pl,icon:r.icon,def:r.def,dx:r.dx,en:r.en,ex:r.ex,exe:r.exe,note:[r.lvl,r.note].filter(Boolean).join(" · "),tags:[String(r.lvl||"").toLowerCase()].filter(Boolean)}));
    R.added.push({w:(art?art+" ":"")+r.de,key});});
   for(let j=res.length;j<part.length;j++)R.nf.push(part[j]);
   save();}
  LK.busy=0;
  if(!dn&&navigator.onLine&&S.cards.some(c=>c.deck==="Looked up"))await autoSort(false,true);
  const fin=R.added.map(a=>{const c=S.cards.find(x=>nf(full(x))===a.key);return{w:a.w,deck:c?c.deck:"?",lvl:c?(lvlOf(c)||"no level"):"?"}});
  const uns=fin.filter(a=>a.deck==="Looked up"),sorted=fin.filter(a=>a.deck!=="Looked up");
  const L=[all.length+" word"+(all.length===1?"":"s")+" entered"+(all.length>ws.length?", first "+ws.length+" processed":"")+".",R.added.length+" cards added."];
  if(R.dups.length)L.push(R.dups.length+" skipped as duplicates (not added).");
  if(R.nf.length)L.push(R.nf.length+" not found.");
  if(R.fail.length)L.push(R.fail.length+" couldn’t be looked up.");
  if(R.added.length)L.push(dn?"All added cards went into “"+dn+"”.":sorted.length+" sorted into level and topic decks"+(uns.length?", "+uns.length+" not sorted yet.":"."));
  const sec=[{t:"Added cards and where they are ("+fin.length+")",rows:fin.map(a=>a.w+" → "+a.deck+" · "+a.lvl)},{t:"Skipped duplicates ("+R.dups.length+")",rows:R.dups},{t:"Not found ("+R.nf.length+")",rows:R.nf},{t:"Couldn’t be looked up ("+R.fail.length+")",rows:R.fail},{t:"Sorted ("+sorted.length+")",rows:sorted.map(a=>a.w+" → "+a.deck)},{t:"Not sorted yet ("+uns.length+")",rows:uns.map(a=>a.w+" → "+a.deck)}];
  const el=$("#lt");if(el)el.value="";
  LK={t:"",res:null,busy:0,d:dn,m:"",b:bs};save();render();
  notice("Lookup finished",L,(R.nf.length||R.fail.length||uns.length)?"warn":"ok",sec)},
 lstop:()=>{LK.stop=true;toast("Stopping after this batch…")},
 uml:el=>{const i=$("#ans"),s=i.selectionStart==null?i.value.length:i.selectionStart;i.value=i.value.slice(0,s)+el.dataset.v+i.value.slice(s);i.focus();i.setSelectionRange(s+1,s+1)},
 slow:()=>speak(full(cur()),.5),
 undo:()=>{const u=Q.u;if(!u||Q.i<1)return;Object.assign(S.cards.find(x=>x.id===u.c.id),u.c);S.log[today()]=u.l;if(u.re){if(u.rq)Q.queue.pop();Q.miss.pop()}else Q.okc--;Q.i--;Q.done--;Q.u=null;save();setup();render()},
 ochip:el=>{O.n=+$("#on").value||O.n;O.ot=$("#ot").value;const a=O[el.dataset.k],v=el.dataset.v,i=a.indexOf(v);if(i<0)a.push(v);else a.splice(i,1);render()},
 gen:async()=>{
  O.n=Math.max(1,Math.min(50,+$("#on").value||10));O.ot=$("#ot").value.trim();
  const tp=[...O.tp,...(O.ot?[O.ot]:[])];
  if(!O.lv.length||!O.ty.length||!tp.length)return toast("Pick at least one level, topic and card type");
  let sm=null;try{sm=await claude.use("sample")}catch(e){}
  
  O.busy=1;render();toast("Generating "+O.n+" cards…");
  const known=S.cards.map(c=>c.de).join("; ").slice(0,500);
  const pr=`You are a German lexicographer. Create exactly ${O.n} German flashcards as a JSON array and nothing else (no prose, no markdown).\nCEFR levels: ${O.lv.join(", ")}. Topics: ${tp.join(", ")}. Card types: ${O.ty.join(", ")}.\nQuality bar: advanced, rigorous, professional-grade terms – for C1/C2 use academic, technical and specialist register; never elementary words (Haus, Buch, essen…) above A2. Check gender, plural and verb forms carefully. Do not repeat: ${known||"none"}.\nEach item: {"de":"word or phrase without article","art":"der|die|das or empty","pl":"plural or empty","type":"vocabulary|phrases|verbs|adjectives|idioms","lvl":"C1","topic":"one of the topics","icon":"one emoji","def":"German-only explanation, one sentence","dx":"accurate English translation of def","ex":"one natural German example sentence","exe":"English translation of the example","en":"English translation of the word or phrase","note":"English grammar notes"}`;
  try{
   const t=await ask(pr),a=JSON.parse(t.slice(t.indexOf("["),t.lastIndexOf("}")+1)+"]");
   let n=0;a.forEach(x=>{if(!x||!x.de||!x.def||!O.lv.includes(String(x.lvl).toUpperCase().trim())||S.cards.some(c=>c.de===x.de))return;
    S.cards.push(mk({kind:x.type,deck:autoDeck({lvl:x.lvl,topic:x.topic||tp[0]}),art:["der","die","das"].includes(x.art)?x.art:"",de:x.de,pl:x.pl,icon:x.icon,def:x.def,dx:x.dx,ex:x.ex,exe:x.exe,en:x.en,note:[x.lvl,x.type,x.note].filter(Boolean).join(" · "),tags:[String(x.lvl).toLowerCase(),x.type].filter(Boolean)}));n++});
   save();notice(n?"Cards ready":"Nothing new",n?[n+" cards saved for offline study.","They were sorted into level and topic decks automatically."]:["No new cards matched – try again."],n?"ok":"warn")
  }catch(e){toast(e&&e.msg?e.msg:"Couldn’t generate cards – check your connection")}
  O.busy=0;render()}
});
["online","offline"].forEach(ev=>window.addEventListener(ev,()=>{if(T==="add"&&!O.busy)render()}));
