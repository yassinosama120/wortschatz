];

const full=c=>(c.art?c.art+" ":"")+c.de;
const norm=s=>String(s).toLowerCase().replace(/^(der|die|das)\s+/,"").replace(/[^\p{L}\s]/gu,"").replace(/\s+/g," ").trim();
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const def=()=>({cards:[],set:{theme:"auto",pal:"minimal",fs:16},log:{},id:1});
const K="wortschatz.v1";
let S=(()=>{try{const r=JSON.parse(localStorage.getItem(K));if(r&&r.cards)return r}catch(e){}return def()})();

let T="study",E=null,P=null,F={q:"",d:"All"},Q={on:false,mode:"mixed",queue:[],i:0,done:0};
let tt;

function theme(){const r=document.documentElement;r.dataset.pal=S.set.pal;if(S.set.theme==="auto")r.removeAttribute("data-theme");else r.dataset.theme=S.set.theme;r.style.fontSize=S.set.fs+"px"}

// ---------- SM-2 (q: 1 Again, 3 Hard, 4 Good, 5 Easy) ----------
function sm2(c,q){
 if(q<3){c.reps=0;c.iv=0;c.due=Date.now()+6e5;c.lap=(c.lap||0)+1}
 else{const p=c.iv||0,r=c.reps,g=r===0?3:r===1?7:Math.max(p+1,Math.round(p*c.ef));c.reps++;c.iv=q===3?(r===0?1:Math.max(1,Math.min(g-1,Math.round(p*1.2)))):q===4?g:Math.max(g+1,r===0?7:r===1?14:Math.round(g*1.3));c.due=Date.now()+c.iv*864e5}
 c.ef=Math.max(1.3,c.ef+.1-(5-q)*(.08+(5-q)*.02));c.n++;return c}
const ivText=(c,q)=>{const x=sm2({...c},q);return x.reps?x.iv+"d":"10m"};

// ---------- cards, enrichment, speech ----------
const mk=o=>({id:S.id++,deck:o.deck||"My Words",art:o.art||"",de:o.de,pl:o.pl||"",icon:o.icon||"🔤",def:o.def||"",en:o.en||"",note:o.note||"",dx:o.dx||"",ex:o.ex||"",exe:o.exe||"",tags:o.tags||[],ef:2.5,reps:0,iv:0,due:Date.now(),n:0});
function enrich(raw){
 const t=raw.trim().replace(/\s+/g," "),m=t.match(/^(der|die|das)\s+(.+)$/i),w=(m?m[2]:t).toLowerCase();
 const e=D.find(x=>x[2].toLowerCase()===w||x[2].toLowerCase()===t.toLowerCase());
 if(e)return{src:raw,found:1,deck:"My Words",art:e[1],de:e[2],pl:e[3],icon:e[4],def:e[5],en:e[6],note:e[7]};
 const art=m?m[1].toLowerCase():"";
 return{src:raw,found:0,deck:"My Words",art,de:m?m[2]:t,pl:"",icon:"🔤",def:"Erklärung noch offen – bitte ergänzen.",en:"",note:art?"Gender taken from the article you typed; plural unknown.":"Not in the offline lexicon – add a translation."}}
function speak(txt,rate){try{const u=new SpeechSynthesisUtterance(txt);u.lang="de-DE";u.rate=rate||S.set.sp||.9;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith("de"));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){toast("Speech output isn’t available here")}}
function mic(cb){
 const R=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!R){const s=D[Math.floor(Math.random()*D.length)];toast("No speech recognition here – simulated input");cb(full({art:s[1],de:s[2]}));return}
 try{const r=new R();r.lang="de-DE";r.onresult=e=>cb(e.results[0][0].transcript);r.onerror=()=>toast("Couldn’t hear anything");r.start();toast("Listening…")}catch(e){toast("Microphone unavailable")}}
const have=k=>D.filter(e=>e[0]===k).every(e=>S.cards.some(c=>c.deck===CN[k]&&c.de===e[2]));
const inst=k=>D.filter(e=>e[0]===k).forEach(e=>{if(!S.cards.some(c=>c.deck===CN[k]&&c.de===e[2]))S.cards.push(mk({deck:CN[k],art:e[1],de:e[2],pl:e[3],icon:e[4],def:e[5],en:e[6],note:e[7],tags:[k.toLowerCase()]}))});
function streak(){let n=0,d=new Date();if(!(S.log[today()]||{}).r)d.setDate(d.getDate()-1);while((S.log[dk(d)]||{}).r){n++;d.setDate(d.getDate()-1)}return n}

// ---------- forms ----------
const form=o=>`<label class="mut">Article</label><select id="fa">${["","der","die","das"].map(a=>`<option ${o.art===a?"selected":""} value="${a}">${a||"— none —"}</option>`).join("")}</select>`+
[["fd","Word or phrase",o.de],["fp","Plural",o.pl],["fk","Deck",o.deck],["ft","Tags (comma-separated)",(o.tags||[]).join(", ")],["fi","Icon (emoji)",o.icon]].map(f=>`<label class="mut">${f[1]}</label><input id="${f[0]}" value="${esc(f[2])}">`).join("")+
`<label class="mut">German explanation</label><textarea id="ff" rows="2">${esc(o.def)}</textarea><label class="mut">English translation (hidden while studying)</label><input id="fe" value="${esc(o.en)}"><label class="mut">English translation of the explanation</label><textarea id="fx" rows="2">${esc(o.dx||DEN[o.de]||"")}</textarea><label class="mut">English notes</label><input id="fn" value="${esc(o.note)}">`;
const readForm=()=>{const v=i=>$("#"+i).value.trim();return{art:v("fa"),de:v("fd"),pl:v("fp"),deck:v("fk")||"My Words",tags:v("ft").split(",").map(s=>s.trim()).filter(Boolean),icon:v("fi")||"🔤",def:v("ff"),en:v("fe"),note:v("fn"),dx:v("fx")}};

// ---------- online generation ----------
const LV=["A1","A2","B1","B2","C1","C2"],TP=["Motorsports","Engineering","Daily Conversation","Business"],TY=["vocabulary","phrases","verbs","adjectives","idioms"];
let O={n:10,lv:["C1"],tp:["Engineering"],ty:["vocabulary"],ot:"",busy:0};
const chips=(a,k)=>a.map(x=>`<button class="${O[k].includes(x)?"p":"s"}" data-a="ochip" data-k="${k}" data-v="${x}">${x}</button>`).join("");
function onlineCard(){const on=navigator.onLine;return `<h2>Add cards online</h2><div class="card"><div class="mut">${on?"🟢 Online – generated cards are saved to this device automatically.":"🔴 Offline – connect to the internet to generate cards. Saved cards still work."}</div><label class="mut">Number of cards (1–50)</label><input id="on" type="number" min="1" max="50" value="${O.n}"><label class="mut">Levels</label><div class="row wrap">${chips(LV,"lv")}</div><label class="mut">Topics</label><div class="row wrap">${chips(TP,"tp")}</div><input id="ot" placeholder="Other topic (optional)" value="${esc(O.ot)}" style="margin-top:6px"><label class="mut">Card types</label><div class="row wrap">${chips(TY,"ty")}</div>${srcSel()}<button class="p w" style="margin-top:10px" data-a="gen" ${on&&!O.busy?"":"disabled"}>${O.busy?"Generating…":"Generate & save"}</button></div>`}
// ---------- AI providers, fallback, dictionary ----------
const PVN={claude:"Claude (built-in)",anthropic:"Claude API key",gemini:"Gemini",openai:"ChatGPT"},DM={anthropic:"claude-haiku-5-5",gemini:"gemini-flash-latest",openai:"gpt-4o-mini"};
const keyOf=p=>(S.set.keys||{})[p]||"";
const okp=p=>p==="claude"?typeof claude!=="undefined":!!keyOf(p);
async function call(p,pr,retry){
 if(p==="claude"){const sm=await claude.use("sample");return (await sm(pr,{cache:false})).text}
 const k=keyOf(p),m=(S.set.models||{})[p]||(S.set.auto||{})[p]||DM[p];let r;
 if(p==="gemini")r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(k)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:pr}]}]})});
 else if(p==="openai")r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+k},body:JSON.stringify({model:m,messages:[{role:"user",content:pr}]})});
 else r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":k,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:m,max_tokens:8000,messages:[{role:"user",content:pr}]})});
 if(!r.ok){if(!retry&&!(S.set.models||{})[p]&&(r.status===404||r.status===400)){const a=await pickModel(p);if(a&&a!==m){(S.set.auto=S.set.auto||{})[p]=a;save();return call(p,pr,1)}}throw new Error(PVN[p]+" "+r.status)}
 const d=await r.json();
 return p==="gemini"?d.candidates[0].content.parts.map(x=>x.text||"").join(""):p==="openai"?d.choices[0].message.content:d.content.map(x=>x.text||"").join("")}
async function pickModel(p){const k=keyOf(p);let r,l=[];
 try{
  if(p==="gemini"){r=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key="+encodeURIComponent(k));l=((await r.json()).models||[]).filter(x=>(x.supportedGenerationMethods||[]).includes("generateContent")).map(x=>x.name.replace("models/",""));
   const bad=/lite|preview|exp|image|tts|audio|live|thinking|vision|embed|robotics|computer|gemma|learnlm|nano|banana/i;
   return l.includes("gemini-flash-latest")?"gemini-flash-latest":l.filter(x=>/flash/.test(x)&&!bad.test(x)).sort().pop()||l.find(x=>/flash/.test(x))||l[0]}
  if(p==="openai"){r=await fetch("https://api.openai.com/v1/models",{headers:{Authorization:"Bearer "+k}});l=(await r.json()).data.map(x=>x.id).filter(x=>/^gpt-/.test(x)&&!/audio|realtime|image|transcribe|tts|search|instruct|codex|preview|\d{4}-\d{2}-\d{2}|chat-latest/i.test(x));return l.filter(x=>/mini/.test(x)).sort().pop()||l.sort().pop()}
  r=await fetch("https://api.anthropic.com/v1/models",{headers:{"x-api-key":k,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"}});l=(await r.json()).data.map(x=>x.id);return l.find(x=>/haiku/.test(x))||l[0]
 }catch(e){return null}}
async function ask(pr){
 const src=S.set.src||"auto",base=["claude","gemini","openai","anthropic"],first=src==="auto"||src==="dict"?null:src;
 const order=(first?(S.set.fb===false?[first]:[first,...base.filter(x=>x!==first)]):base).filter(okp);
 if(!order.length)throw{msg:first?PVN[first]+" isn’t available – add its key in Settings":"No AI connected – add an API key in Settings"};
 let last;for(const p of order){try{return await call(p,pr)}catch(e){last=e}}
 throw{msg:"Every AI source failed ("+(last&&last.message||"error")+") – pick another source"}}
async function dict(w){w=w.trim().replace(/^(der|die|das)\s+/i,"");
 for(const t of [...new Set([w,w[0].toUpperCase()+w.slice(1),w.toLowerCase()])]){
  const r=await fetch("https://en.wiktionary.org/w/api.php?action=query&prop=revisions&rvprop=content&rvslots=main&format=json&formatversion=2&origin=*&redirects=1&titles="+encodeURIComponent(t)),pg=(await r.json()).query.pages[0];
  if(pg.missing)continue;
  const m=pg.revisions[0].slots.main.content.match(/==\s*German\s*==([\s\S]*?)(?=\n==[^=]|$)/);if(!m)continue;
  const s=m[1],cl=x=>x.replace(/\{\{[^{}]*\}\}/g,"").replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g,"$1").replace(/'{2,3}/g,"").replace(/<[^>]*>/g,"").replace(/\s+/g," ").trim();
  const ds=[...s.matchAll(/^# (?![*:#])(.+)$/gm)].map(x=>cl(x[1])).filter(Boolean).slice(0,3);if(!ds.length)continue;

const gram=()=>`<h2>Grammar</h2><div class="card"><b>Articles by case</b><table class="gt"><tr><th></th><th>der</th><th>die</th><th>das</th><th>pl.</th></tr><tr><td>Nom.</td><td>der</td><td>die</td><td>das</td><td>die</td></tr><tr><td>Akk.</td><td>den</td><td>die</td><td>das</td><td>die</td></tr><tr><td>Dat.</td><td>dem</td><td>der</td><td>dem</td><td>den (+n)</td></tr><tr><td>Gen.</td><td>des</td><td>der</td><td>des</td><td>der</td></tr></table><p class="mut">Columns show the noun’s gender. Masculine and neuter nouns usually add -(e)s in the genitive.</p></div><div class="card"><b>Verb position</b><p>Main clause: verb in 2nd place. Questions: verb first. Subordinate clause (weil, dass, wenn): verb at the end. Perfekt: haben/sein in 2nd place, participle at the end.</p></div><div class="card"><b>Prepositions</b><p><b>Akkusativ:</b> durch, für, gegen, ohne, um<br><b>Dativ:</b> aus, bei, mit, nach, seit, von, zu<br><b>Two-way</b> (Akk. = where to, Dat. = where): an, auf, hinter, in, neben, über, unter, vor, zwischen<br><b>Genitiv:</b> während, wegen, trotz, statt</p></div><div class="card"><b>Present-tense endings (regular verbs)</b><p>ich -e · du -st · er/sie/es -t · wir -en · ihr -t · sie/Sie -en</p></div><div class="card"><b>Modal verbs</b><p>können, müssen, wollen, sollen, dürfen, mögen: the modal takes 2nd place and the infinitive goes to the end. <i>Ich muss heute lernen.</i></p></div><div class="card"><b>Separable verbs</b><p>aufstehen → <i>Ich stehe um 7 Uhr auf.</i> Perfekt: <i>ist aufgestanden</i>. In subordinate clauses they stay together: <i>…, dass er aufsteht.</i></p></div><div class="card"><b>Word order: TeKaMoLo</b><p>Time → Reason (kausal) → Manner (modal) → Place (lokal): <i>Ich fahre morgen wegen der Arbeit mit dem Zug nach Berlin.</i></p></div><div class="card"><b>Adjective endings</b><p>After der/die/das: Nom. -e (all singular); Akk. masc. -en, fem./neut. -e; Dat., Gen. and all plurals -en. After ein-words the masculine nominative is -er and the neuter nominative/accusative is -es.</p></div><div class="card"><b>Connectors</b><p><b>No word-order change:</b> und, aber, oder, denn, sondern.<br><b>Verb right after:</b> deshalb, darum, trotzdem, dann.<br><b>Verb at the end:</b> weil, dass, obwohl, wenn, als, damit, während, nachdem, ob.</p></div><div class="card"><b>Perfekt vs. Präteritum</b><p>Speech and everyday writing: Perfekt (<i>ich habe gemacht</i>). Formal writing and narration: Präteritum (<i>ich machte</i>). sein, haben and modals prefer the Präteritum even in speech (<i>war, hatte, konnte</i>).</p></div><div class="card"><b>Konjunktiv II</b><p>Polite requests and unreal situations: <i>hätte, wäre, könnte, würde + Infinitiv</i>. <i>Wenn ich Zeit hätte, würde ich mehr lesen.</i></p></div><div class="card"><b>Passive</b><p>werden + Partizip II: <i>Das Haus wird gebaut.</i> Past: <i>wurde gebaut</i>. Result state: sein + Partizip II: <i>Das Haus ist gebaut.</i> The agent uses von + Dativ.</p></div><div class="card"><b>Relative clauses</b><p>The pronoun matches the noun’s gender and number; its case comes from its role in the clause. Forms equal the articles except dative plural <i>denen</i> and genitive <i>dessen/deren</i>. The verb goes to the end, set off by commas.</p></div><div class="card"><b>Academic style</b><p>Nominalisation (<i>analysieren → die Analyse</i>), passive and impersonal forms (<i>man</i>, <i>es wird gezeigt, dass …</i>), and fixed verb phrases (<i>in Betracht ziehen, zur Verfügung stellen</i>).</p></div>`;

 `<div class="card"><b>Reviews, last 7 days</b><div class="bars">${days.map(d=>`<div class="bar"><small class="mut">${d.r||""}</small><i style="height:${Math.round(d.r/mx*80)}%"></i><small class="mut">${d.l}</small></div>`).join("")}</div></div>`+

function sett(){return `<h2>Settings</h2><div class="card"><label class="mut">Appearance</label><select id="th">${["auto","light","dark"].map(v=>`<option ${S.set.theme===v?"selected":""} value="${v}">${v}</option>`).join("")}</select><label class="mut">Palette</label><div class="row wrap">${[["minimal","Minimalist"],["pastel","Pastel"],["neon","Neon"]].map(p=>`<button class="${S.set.pal===p[0]?"p":"s"}" data-a="pal" data-v="${p[0]}">${p[1]}</button>`).join("")}</div><label class="mut">Speech speed</label><select id="sp">${[[.6,"Slow"],[.9,"Normal"],[1.1,"Fast"]].map(x=>`<option value="${x[0]}" ${(S.set.sp||.9)===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select><label class="mut">Daily goal (reviews)</label><input id="dg" type="number" min="5" max="500" value="${S.set.dg||20}"><label class="mut">Font size</label><input id="fs" type="range" min="14" max="22" value="${S.set.fs}"></div>`+
 `<div class="card"><b>Export / import (JSON)</b><div class="mut">${S.set.bk?"Last backup: "+new Date(S.set.bk).toLocaleDateString():"No backup yet"}${!S.set.bk||Date.now()-S.set.bk>6048e5?" – time to back up!":""}</div><textarea id="ex" rows="4" readonly>${esc(JSON.stringify(S.cards))}</textarea><button class="s" data-a="copy" style="margin:6px 0">Copy</button><textarea id="im" rows="3" placeholder="Paste exported JSON here"></textarea><button class="s" data-a="import" style="margin-top:6px">Import (merge)</button></div>${srcCard()}<div class="card"><button class="s w" data-a="reset">Erase all data</button></div>`}

function render(){const lt=$("#lt");if(lt)LK.t=lt.value;const bt=$("#bt");if(bt){B.t=bt.value;B.d=$("#bd").value}$("#main").innerHTML=({study,quiz:study,add,lib,stats,sett,gram})[T]();document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===T))}

// ---------- actions ----------
function rate(q){const c=cur();if(!c||!Q.rev)return;const k0=today();Q.u={c:{...c},l:{...(S.log[k0]||{r:0,ok:0})},re:q<3};if(q>=3)Q.okc=(Q.okc||0)+1;else(Q.miss=Q.miss||[]).push(c.id);if(!Q.prac)sm2(c,q);const k=today(),l=S.log[k]||(S.log[k]={r:0,ok:0});l.r++;if(q>=3)l.ok++;Q.done++;if(q<3)Q.queue.push(c.id);Q.i++;save();try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}setup();render()}
const arm=(el,txt)=>{if(el.dataset.arm)return true;el.dataset.arm=1;el.textContent=txt;return false};
const H={
 tab:el=>{T=el.dataset.t;E=null;V=null;if(!Q.on)Q.mode=T==="quiz"?"mixed":"explain";render()},
 mic:el=>mic(t=>{$("#"+el.dataset.to).value=t}),
 enrich:()=>{const v=$("#w").value;if(!v.trim())return toast("Enter a word first");P=enrich(v);render()},
 saveNew:()=>{const f=readForm();if(!f.de)return toast("Enter a word first");S.cards.push(mk(f));P=null;save();render();toast("Card saved offline ✓")},
 inst:el=>{inst(el.dataset.k);save();render();toast("Course saved for offline study ✓")},
 seed:()=>{Object.keys(CN).forEach(inst);save();render()},
 deck:el=>{F.d=el.dataset.v;render()},
 edit:el=>{E=+el.dataset.id;V=null;render()},
 cancel:()=>{E=null;render()},
 saveEdit:()=>{const f=readForm();if(!f.de)return toast("The word can’t be empty");Object.assign(S.cards.find(x=>x.id===E),f);E=null;save();render();toast("Saved")},
 del:el=>{if(!arm(el,"Tap again to delete"))return;S.cards=S.cards.filter(x=>x.id!==E);E=null;save();render()},
 mode:el=>{Q.mode=el.dataset.v;render()},
 start:()=>{const now=Date.now(),sc=Q.scope||"due",p=pool().filter(c=>(sc!=="hard"||(c.lap||0)>=3)&&(T!=="quiz"||sc!=="due"||c.n>0));
  const q=sc==="all"||sc==="hard"?shuf(p):sc==="random"?shuf(p).slice(0,20):p.filter(c=>c.due<=now).sort((a,b)=>a.due-b.due).slice(0,20);
  if(!q.length)return toast(sc==="due"?"Nothing due here – try Random or All cards":"No cards match these filters");
  Q={...Q,on:true,ctx:T==="quiz"?"quiz":"learn",prac:sc!=="due",queue:q.map(c=>c.id),i:0,done:0,okc:0,miss:[],u:null};setup();render()},
 end:()=>{Q.on=false;render()},
 say:()=>speak(full(cur())),
 tr:()=>{Q.tr=!Q.tr;render()},
 reveal:()=>{Q.res={ok:false};Q.rev=true;render()},
 opt:el=>{Q.res={ok:+el.dataset.id===cur().id};Q.rev=true;render()},
 check:()=>{const c=cur(),v=$("#ans").value;if(!v.trim())return toast("Type or speak an answer first");Q.res={ok:norm(v)===norm(c.de)};Q.rev=true;render();speak(full(c))},
 rate:el=>rate(+el.dataset.q),
 pal:el=>{S.set.pal=el.dataset.v;theme();save();render()},
 copy:()=>{S.set.bk=Date.now();save();const t=$("#ex");t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast("Copied"),()=>{document.execCommand("copy");toast("Copied")})}catch(e){toast("Select the text and copy it manually")}},
 import:()=>{try{const a=JSON.parse($("#im").value);if(!Array.isArray(a))throw 0;let n=0;a.forEach(x=>{if(x&&x.de&&x.deck&&!S.cards.some(c=>c.deck===x.deck&&c.de===x.de)){S.cards.push({...mk(x),...x,id:S.id++});n++}});save();render();toast(n+" cards imported")}catch(e){toast("That isn’t valid exported JSON")}},
 reset:el=>{if(!arm(el,"Tap again to erase everything"))return;S=def();Q={on:false,mode:"mixed",queue:[],i:0,done:0};save();theme();render()}
};
Object.assign(H,{
 bulk:()=>{
  const raw=$("#bt").value.trim(),deck=$("#bd").value.trim()||"Pasted words";
  if(!raw)return toast("Paste some words or phrases first");
  let n=0;const put=x=>{if(x&&x.de&&!S.cards.some(c=>c.deck===deck&&c.de===x.de)){S.cards.push(mk({...x,deck}));n++}};
  const i=raw.indexOf("[");
  if(i>=0&&/^[`\s]*(json)?\s*$/i.test(raw.slice(0,i))){
   try{JSON.parse(raw.slice(i,raw.lastIndexOf("]")+1)).forEach(x=>put(x&&{...x,art:["der","die","das"].includes(x.art)?x.art:"",tags:Array.isArray(x.tags)?x.tags:[]}))}catch(e){return toast("That JSON couldn’t be read")}}
  else raw.split(/[\n;]+/).map(s=>s.trim()).filter(Boolean).slice(0,200).forEach(l=>{const m=l.split(/\s+[-–—|]\s+|\t/),e=enrich(m[0]);if(m[1])e.en=m[1].trim();put(e)});
  $("#bt").value="";save();render();toast(n+" cards added")},
 aiprompt:()=>{const p=`Create German flashcards as a JSON array only (no prose). Words or topic and CEFR level: [paste here]. Each item: {"de":"word or phrase without article","art":"der|die|das or empty","pl":"plural or empty","icon":"one emoji","def":"German-only explanation, one sentence","dx":"English translation of def","ex":"one natural German example sentence","exe":"English translation of the example","en":"English translation of the word or phrase","note":"English grammar notes"}`;
  try{navigator.clipboard.writeText(p).then(()=>toast("Prompt copied – paste it into ChatGPT, Gemini or Claude"),()=>toast("Couldn’t copy the prompt"))}catch(e){toast("Couldn’t copy the prompt")}},
 prev:el=>{V={id:+el.dataset.id,tr:false};render()},
 pclose:()=>{V=null;render()},
 ptr:()=>{V.tr=!V.tr;render()},
 pspeak:el=>{const c=S.cards.find(x=>x.id===+el.dataset.id);if(c)speak(full(c))},
 fscope:el=>{Q.scope=el.dataset.v;render()},
 flv:el=>{Q.lv=el.dataset.v;render()},
 fdk:el=>{Q.dk=el.dataset.v;render()},
 art:el=>{Q.res={ok:el.dataset.v===cur().art};Q.rev=true;render()},
 look:async()=>{
  LK.t=$("#lt").value;const ws=LK.t.split(/[\n;,]+/).map(s=>s.trim()).filter(Boolean).slice(0,15);
  if(!ws.length)return toast("Type at least one word");
  let sm=null;try{sm=await claude.use("sample")}catch(e){}
  
  LK.busy=1;LK.res=null;render();
  const pr=`You are a German dictionary. For each input below identify the intended German word or phrase (fix spelling mistakes; if ambiguous pick the most common meaning): ${ws.join(" | ")}\nReturn a JSON array only, one item per input, in order: {"de":"headword without article","art":"der|die|das or empty","pl":"plural or empty","icon":"one emoji","en":"main English meaning","def":"German-only explanation, one sentence","dx":"English translation of def","ex":"German example sentence","exe":"English translation of the example","note":"English grammar notes","lvl":"CEFR level","found":true}`;
  try{LK.res=(await lookAll(ws,pr)).filter(x=>x&&x.de).map(x=>({...x,ok:x.found!==false}))}catch(e){toast(e&&e.msg?e.msg:"Couldn’t look those up – check your connection")}
  LK.busy=0;render()},
 lksave:()=>{let n=0;(LK.res||[]).forEach(r=>{if(!r.ok||S.cards.some(c=>c.deck==="Looked up"&&c.de===r.de))return;S.cards.push(mk({deck:"Looked up",art:["der","die","das"].includes(r.art)?r.art:"",de:r.de,pl:r.pl,icon:r.icon,def:r.def,dx:r.dx,en:r.en,ex:r.ex,exe:r.exe,note:[r.lvl,r.note].filter(Boolean).join(" · "),tags:[String(r.lvl||"").toLowerCase()].filter(Boolean)}));n++});$("#lt").value="";LK={t:"",res:null,busy:0};save();render();toast(n+" cards saved")},
 savesett:async()=>{document.querySelectorAll("[data-key]").forEach(i=>{(S.set.keys=S.set.keys||{})[i.dataset.key]=i.value.trim()});document.querySelectorAll("[data-model]").forEach(i=>{(S.set.models=S.set.models||{})[i.dataset.model]=i.value.trim()});const s=$("#src"),f=$("#fb");if(s)S.set.src=s.value;if(f)S.set.fb=f.checked;save();const n=["gemini","openai","anthropic"].filter(p=>keyOf(p));if(!n.length)return toast("Saved – no API key entered yet");toast("Saved – finding model names…");const fm=[];for(const p of n){if(!(S.set.models||{})[p]){const a=await pickModel(p);if(a)(S.set.auto=S.set.auto||{})[p]=a}fm.push(PVN[p]+": "+((S.set.models||{})[p]||(S.set.auto||{})[p]||"default"))}save();render();toast("Saved – "+fm.join(" · "))},
 uml:el=>{const i=$("#ans"),s=i.selectionStart==null?i.value.length:i.selectionStart;i.value=i.value.slice(0,s)+el.dataset.v+i.value.slice(s);i.focus();i.setSelectionRange(s+1,s+1)},
 slow:()=>speak(full(cur()),.5),
 undo:()=>{const u=Q.u;if(!u||Q.i<1)return;Object.assign(S.cards.find(x=>x.id===u.c.id),u.c);S.log[today()]=u.l;if(u.re){Q.queue.pop();Q.miss.pop()}else Q.okc--;Q.i--;Q.done--;Q.u=null;save();setup();render()},
 ochip:el=>{O.n=+$("#on").value||O.n;O.ot=$("#ot").value;const a=O[el.dataset.k],v=el.dataset.v,i=a.indexOf(v);if(i<0)a.push(v);else a.splice(i,1);render()},
 gen:async()=>{
  O.n=Math.max(1,Math.min(50,+$("#on").value||10));O.ot=$("#ot").value.trim();
  const tp=[...O.tp,...(O.ot?[O.ot]:[])];
  if(!O.lv.length||!O.ty.length||!tp.length)return toast("Pick at least one level, topic and card type");
  let sm=null;try{sm=await claude.use("sample")}catch(e){}
  
  O.busy=1;render();
  const known=S.cards.map(c=>c.de).join("; ").slice(0,500);
  const pr=`You are a German lexicographer. Create exactly ${O.n} German flashcards as a JSON array and nothing else (no prose, no markdown).\nCEFR levels: ${O.lv.join(", ")}. Topics: ${tp.join(", ")}. Card types: ${O.ty.join(", ")}.\nQuality bar: advanced, rigorous, professional-grade terms – for C1/C2 use academic, technical and specialist register; never elementary words (Haus, Buch, essen…) above A2. Check gender, plural and verb forms carefully. Do not repeat: ${known||"none"}.\nEach item: {"de":"word or phrase without article","art":"der|die|das or empty","pl":"plural or empty","type":"vocabulary|phrases|verbs|adjectives|idioms","lvl":"C1","topic":"one of the topics","icon":"one emoji","def":"German-only explanation, one sentence","dx":"accurate English translation of def","ex":"one natural German example sentence","exe":"English translation of the example","en":"English translation of the word or phrase","note":"English grammar notes"}`;
  try{
   const t=await ask(pr),a=JSON.parse(t.slice(t.indexOf("["),t.lastIndexOf("}")+1)+"]");
   let n=0;a.forEach(x=>{if(!x||!x.de||!x.def||!O.lv.includes(String(x.lvl).toUpperCase().trim())||S.cards.some(c=>c.de===x.de))return;
    S.cards.push(mk({deck:"Online · "+(x.topic||tp[0]),art:["der","die","das"].includes(x.art)?x.art:"",de:x.de,pl:x.pl,icon:x.icon,def:x.def,dx:x.dx,ex:x.ex,exe:x.exe,en:x.en,note:[x.lvl,x.type,x.note].filter(Boolean).join(" · "),tags:[String(x.lvl).toLowerCase(),x.type].filter(Boolean)}));n++});
   save();toast(n?n+" cards saved for offline study ✓":"No new cards matched – try again")
  }catch(e){toast(e&&e.msg?e.msg:"Couldn’t generate cards – check your connection")}
  O.busy=0;render()}
});
["online","offline"].forEach(ev=>window.addEventListener(ev,()=>{if(T==="add"&&!O.busy)render()}));
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(el&&H[el.dataset.a])H[el.dataset.a](el)});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="q"){F.q=t.value;$("#list").innerHTML=list()}if(t.id==="fs"){S.set.fs=+t.value;theme()}});
document.addEventListener("change",e=>{const t=e.target;if(t.id==="th"){S.set.theme=t.value;theme();save()}if(t.dataset.lk!=null&&LK.res)LK.res[+t.dataset.lk].ok=t.checked;if(t.id==="src"){S.set.src=t.value;save();render()}if(t.id==="fb"){S.set.fb=t.checked;save()}if(t.dataset.key){(S.set.keys=S.set.keys||{})[t.dataset.key]=t.value.trim();save()}if(t.dataset.model){(S.set.models=S.set.models||{})[t.dataset.model]=t.value.trim();save()}if(t.id==="fs")save();if(t.id==="sp"){S.set.sp=+t.value;save()}if(t.id==="dg"){S.set.dg=Math.max(1,+t.value||20);save()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="ans")H.check()});
let sx=null;
document.addEventListener("touchstart",e=>{sx=e.target.closest("[data-sw]")?e.touches[0].clientX:null},{passive:true});
document.addEventListener("touchend",e=>{if(sx==null||!Q.on||!Q.rev)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(dx>80)rate(4);else if(dx<-80)rate(1)},{passive:true});
theme();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
